name: Java build

on:
  push:
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            maven: ./mvnw
          - os: windows-latest
            maven: .\mvnw.cmd
          - os: macos-latest
            maven: ./mvnw
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check formatting, test, and package
        run: ${{ matrix.maven }} --batch-mode --no-transfer-progress clean verify
      - name: Build native CLI package
        shell: bash
        run: |
          package_path="$(python scripts/package.py)"
          printf 'LINE_TRACKER_PACKAGE=%s\n' "$package_path" >> "$GITHUB_ENV"
      - name: Test extracted native package without installed Java
        shell: bash
        run: python scripts/test_package.py "$LINE_TRACKER_PACKAGE"
      - name: Upload verified native CLI package
        uses: actions/upload-artifact@v4
        with:
          name: line-tracker-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload runnable application JAR
        uses: actions/upload-artifact@v4
        with:
          name: line-tracker-${{ matrix.os }}
          path: target/line-tracker.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: test
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform builds to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = "success"
